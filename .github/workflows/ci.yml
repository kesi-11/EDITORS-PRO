name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ─── Rust Engine Checks ──────────────────────────────────────────────
  rust-check:
    name: Rust (check + clippy + test + coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config

      - name: Cargo check
        run: cargo check --manifest-path engine/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --manifest-path engine/Cargo.toml --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Rust Benchmarks ────────────────────────────────────────────────
  rust-bench:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: rust-bench-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            rust-bench-${{ runner.os }}-

      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config

      - name: Run benchmarks
        run: cargo bench --manifest-path engine/Cargo.toml -- --save-baseline main

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: engine/target/criterion/
          retention-days: 30

  # ─── Flutter App Checks ──────────────────────────────────────────────
  flutter-check:
    name: Flutter (analyze + test + coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test with coverage
        run: flutter test --coverage

      - name: Upload Flutter coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Android Release Build ──────────────────────────────────────────
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [rust-check, flutter-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: rust-android-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            rust-android-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Android SDK / NDK setup ─────────────────────────────────────
      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ vars.ANDROID_NDK_VERSION || '27.0.12077973' }}
        run: sdkmanager --install "ndk;27.0.12077973"

      # ── Build Rust engine for Android ───────────────────────────────
      - name: Build Rust engine (arm64-v8a)
        run: cargo ndk -t arm64-v8a build --release --manifest-path engine/Cargo.toml

      - name: Copy native library to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp engine/target/aarch64-linux-android/release/libeditors_pro_engine.so \
             android/app/src/main/jniLibs/arm64-v8a/

      # ── Build Flutter APK ───────────────────────────────────────────
      - name: Build Flutter APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: editors-pro-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ─── Release on Tag ────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: editors-pro-arm64-release
          path: ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
